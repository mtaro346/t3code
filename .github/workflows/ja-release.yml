# Japanese fork release: a `vX.Y.Z-ja` tag builds the unsigned macOS app and publishes it.
# Squirrel.Mac cannot apply updates to unsigned apps, so the build ships without an update feed.
name: Release (ja)

on:
  push:
    tags:
      - "v*.*.*-ja"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z-ja tag to rebuild"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ja-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository != 'pingdotgg/t3code'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Resolve version
        id: version
        run: |
          version="${TAG#v}"
          version="${version%-ja}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $TAG" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Check translations
        run: |
          node apps/web/vite/ja/translate.check.ts
          missing="$(node apps/web/vite/ja/extract.ts)"
          if [[ "$missing" != "[]" ]]; then
            echo "::warning::Untranslated UI text ships in English: $missing"
          fi

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build macOS app
        run: |
          env -u GITHUB_REPOSITORY -u T3CODE_DESKTOP_UPDATE_REPOSITORY \
          vp run dist:desktop:artifact \
            --platform mac --target dmg --arch arm64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --output-dir release --verbose

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release/*.dmg)
          (( ${#assets[@]} > 0 )) || { echo "No release assets found" >&2; ls -la release; exit 1; }
          notes="公式 [v${{ steps.version.outputs.version }}](https://github.com/pingdotgg/t3code/releases/tag/v${{ steps.version.outputs.version }}) の日本語版です。署名していないため、初回は Finder でアプリを右クリックして「開く」を選んでください。アプリ内の自動更新は使えないので、新しい版はこのページから dmg をダウンロードしてください。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "T3 Code ${{ steps.version.outputs.version }} 日本語版" --notes "$notes" --latest
          fi
