# Japanese fork release: builds the unsigned macOS arm64 app "T3 Code JA" and publishes it as `vX.Y.Z-ja`.
# A push to `ja` releases the newest upstream stable tag it contains, once; the release creates the tag,
# because the scheduled cloud sync can push branches but not tags.
# Mirrors apps/web/vite/ja/release.sh (which stays as the local fallback on a Mac).
# Squirrel.Mac cannot apply updates to unsigned apps, so the build ships without an update feed.
name: Release (ja)

on:
  push:
    branches:
      - ja
    tags:
      - "v*.*.*-ja"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z-ja tag to rebuild"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Checkout
        if: github.ref_type == 'branch' && github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Peeled (^{}) lines carry the commit of annotated tags and override the tag object's sha.
          upstream="$(git ls-remote --tags https://github.com/pingdotgg/t3code.git |
            awk '$2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+(\^\{\})?$/ { n=$2; sub(/^refs\/tags\//,"",n); p=sub(/\^\{\}$/,"",n); if (p || !(n in sha)) sha[n]=$1 } END { for (n in sha) print n, sha[n] }' |
            sort -rV)"
          version=""
          while read -r name sha; do
            if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then version="$name"; break; fi
          done <<< "$upstream"
          [[ -n "$version" ]] || { echo "::error::ja contains no upstream stable tag"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$version-ja" >/dev/null; then
            echo "$version-ja is already released"; exit 0
          fi
          echo "tag=$version-ja" >> "$GITHUB_OUTPUT"; echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: macos-latest
    timeout-minutes: 120
    concurrency:
      group: ja-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      REF: ${{ needs.prepare.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}

      - name: Resolve version
        id: version
        run: |
          version="${TAG#v}"
          version="${version%-ja}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $TAG" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable

      - name: Install dependencies
        run: vp install

      - name: Check translations
        run: |
          node apps/web/vite/ja/translate.check.ts
          missing="$(node apps/web/vite/ja/extract.ts)"
          if [[ "$missing" != "[]" ]]; then
            echo "::warning::Untranslated UI text ships in English: $missing"
          fi

      # Rename the app so it installs beside the official one; fail if upstream moved these lines.
      - name: Rebrand as T3 Code JA
        run: |
          rebrand() {
            grep -qF "$2" "$1" || { echo "rebrand: $2 not found in $1" >&2; exit 1; }
            FROM="$2" TO="$3" perl -pi -e 's/\Q$ENV{FROM}\E/$ENV{TO}/' "$1"
          }
          rebrand apps/desktop/package.json '"productName": "T3 Code (Beta)"' '"productName": "T3 Code JA"'
          rebrand scripts/build-desktop-artifact.ts 'DESKTOP_APP_ID = "com.t3tools.t3code";' 'DESKTOP_APP_ID = "com.t3tools.t3code.ja";'

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build macOS app
        run: |
          env -u GITHUB_REPOSITORY -u T3CODE_DESKTOP_UPDATE_REPOSITORY \
          node scripts/build-desktop-artifact.ts \
            --platform mac --target dmg --arch arm64 \
            --build-version "${{ steps.version.outputs.version }}" \
            --output-dir release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          (( ${#dmgs[@]} == 1 )) || { echo "Expected one dmg, found ${#dmgs[@]}" >&2; ls -la release; exit 1; }
          dmg="release/T3-Code-JA-$VERSION-arm64.dmg"
          [[ "${dmgs[0]}" == "$dmg" ]] || mv "${dmgs[0]}" "$dmg"
          notes="公式 [v$VERSION](https://github.com/pingdotgg/t3code/releases/tag/v$VERSION) の日本語版「T3 Code JA」です。公式版と設定・プロジェクト・スレッドを共有します（同時には起動できないので、切り替えるときはもう片方を終了してください）。署名していないため、初回は Finder でアプリを右クリックして「開く」を選んでください。アプリ内の自動更新は使えないので、新しい版はこのページから dmg をダウンロードしてください。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
          else
            gh release create "$TAG" "$dmg" --target "$(git rev-parse HEAD)" --title "T3 Code JA $VERSION" --notes "$notes" --latest
          fi
