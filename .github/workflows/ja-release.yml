# Japanese fork release: builds the unsigned "T3 Code JA" app (macOS arm64 dmg, Windows x64 installer)
# and publishes both as `vX.Y.Z-ja`.
# A push to `ja` (or a manual run on it without a tag) releases the newest upstream stable tag it contains,
# once; the release creates the tag, because the scheduled cloud sync can push branches but not tags.
# The macOS build mirrors apps/web/vite/ja/release.sh (which stays as the local fallback on a Mac).
# Squirrel.Mac cannot apply updates to unsigned apps, so both builds ship without an update feed.
# Windows ships without the bundled WSL runtime, which needs a separate Linux CLI archive build.
name: Release (ja)

on:
  push:
    branches:
      - ja
    tags:
      - "v*.*.*-ja"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z-ja tag to rebuild (empty: release the branch like a push)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Checkout
        if: github.ref_type == 'branch'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Peeled (^{}) lines carry the commit of annotated tags and override the tag object's sha.
          upstream="$(git ls-remote --tags https://github.com/pingdotgg/t3code.git |
            awk '$2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+(\^\{\})?$/ { n=$2; sub(/^refs\/tags\//,"",n); p=sub(/\^\{\}$/,"",n); if (p || !(n in sha)) sha[n]=$1 } END { for (n in sha) print n, sha[n] }' |
            sort -rV)"
          version=""
          while read -r name sha; do
            if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then version="$name"; break; fi
          done <<< "$upstream"
          [[ -n "$version" ]] || { echo "::error::ja contains no upstream stable tag"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$version-ja" >/dev/null; then
            echo "$version-ja is already released"; exit 0
          fi
          echo "tag=$version-ja" >> "$GITHUB_OUTPUT"; echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
            ext: dmg
            rust_target: aarch64-apple-darwin
          # Like upstream, Windows packages on Linux: a native Windows build trips the payload file limit.
          - label: Windows x64
            runner: ubuntu-latest
            platform: win
            target: nsis
            arch: x64
            ext: exe
            rust_target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      REF: ${{ needs.prepare.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}

      - name: Resolve version
        id: version
        run: |
          version="${TAG#v}"
          version="${version%-ja}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $TAG" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.rust_target }}"
          rustup default stable

      - name: Install cargo-xwin
        if: matrix.platform == 'win'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Build Windows resource monitor
        if: matrix.platform == 'win'
        run: |
          cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"
          echo "T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR=true" >> "$GITHUB_ENV"

      # The full desktop build on a Linux host compiles the Linux browser secret helper.
      - name: Install browser secret helper build libraries
        if: matrix.platform == 'win'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install dependencies
        run: vp install

      - name: Check translations
        if: matrix.platform == 'mac'
        run: |
          node apps/web/vite/ja/translate.check.ts
          missing="$(node apps/web/vite/ja/extract.ts)"
          if [[ "$missing" != "[]" ]]; then
            echo "::warning::Untranslated UI text ships in English: $missing"
          fi

      # Rename the app so it installs beside the official one; fail if upstream moved these lines.
      - name: Rebrand as T3 Code JA
        run: |
          rebrand() {
            grep -qF "$2" "$1" || { echo "rebrand: $2 not found in $1" >&2; exit 1; }
            FROM="$2" TO="$3" perl -pi -e 's/\Q$ENV{FROM}\E/$ENV{TO}/' "$1"
          }
          rebrand apps/desktop/package.json '"productName": "T3 Code (Beta)"' '"productName": "T3 Code JA"'
          rebrand scripts/build-desktop-artifact.ts 'DESKTOP_APP_ID = "com.t3tools.t3code";' 'DESKTOP_APP_ID = "com.t3tools.t3code.ja";'

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build desktop app
        run: |
          env -u GITHUB_REPOSITORY -u T3CODE_DESKTOP_UPDATE_REPOSITORY \
          node scripts/build-desktop-artifact.ts \
            --platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}" \
            --build-version "${{ steps.version.outputs.version }}" \
            --output-dir release

      - name: Collect artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(release/T3-Code-*.${{ matrix.ext }})
          (( ${#files[@]} == 1 )) || { echo "Expected one .${{ matrix.ext }}, found ${#files[@]}" >&2; ls -la release; exit 1; }
          mkdir -p out
          mv "${files[0]}" "out/T3-Code-JA-$VERSION-${{ matrix.arch }}.${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ja-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    concurrency:
      group: ja-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      REF: ${{ needs.prepare.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ja-*
          merge-multiple: true
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          version="${version%-ja}"
          dmg="T3-Code-JA-$version-arm64.dmg"
          exe="T3-Code-JA-$version-x64.exe"
          for f in "$dmg" "$exe"; do
            [[ -f "out/$f" ]] || { echo "Missing $f" >&2; ls -la out; exit 1; }
          done
          cat > notes.md <<EOF
          公式 [v$version](https://github.com/pingdotgg/t3code/releases/tag/v$version) の日本語版「T3 Code JA」です。公式版と設定・プロジェクト・スレッドを共有します（同時には起動できないので、切り替えるときはもう片方を終了してください）。署名していないため、アプリ内の自動更新は使えません。新しい版はこのページからダウンロードしてください。

          ### macOS（Apple シリコン）: \`$dmg\`

          dmg からアプリを「アプリケーション」フォルダーに入れたあと、ターミナルで \`xattr -dr com.apple.quarantine "/Applications/T3 Code JA.app"\` を実行してから開いてください（入れ直すたびに必要です。実行しないと「壊れているため開けません」と表示されます）。

          ### Windows（x64）: \`$exe\`

          ダウンロードした exe を実行してインストールします。ブラウザーがダウンロードを警告したら「保持」を選んでください。署名していないため、実行すると「Windows によって PC が保護されました」と表示されます。「詳細情報」を押してから「実行」を押してください（新しい版を入れるたびに必要です）。インストールが終わると、スタートメニューから「T3 Code JA」を開けます。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$dmg" "out/$exe" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "out/$dmg" "out/$exe" --target "$(git rev-parse HEAD)" --title "T3 Code JA $version" --notes-file notes.md --latest
          fi
